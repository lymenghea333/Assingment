<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        * {
            box-sizing: border-box;
            /* Include padding and border in the width */
            margin: 0;
            padding: 0;

        }

        .container {
            width: 100%;
            background-color: black;
            overflow: hidden;
            /* Clearfix hack to contain floated elememts */
        }

        .box {
            float: left;
            width: 30%;
            margin: 5px;
            background-color: aquamarine;
            padding: 19px;
            text-align: center;


        }
    </style>
</head>

<body">
    <h2>Float Layout</h2>
    <div class="container">
        <div class="box">Box 1</div>
        <div class="box">Box 2</div>
        <div class="box">Box 3</div>
    </div>

    </body>

</html>
